name: Feature Request
about: Suggest a new feature or enhancement
labels:
  - feature
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want and why?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? What workflow does it improve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - TUI
        - API / Server
        - Monitoring Engine
        - Alerts
        - Distribution / Packaging
        - Documentation
    validations:
      required: false
